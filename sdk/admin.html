<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Support Inbox &mdash; GoChat Merchant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --sidebar: #0f1422;
      --card: #141c2e;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #00add8;
      --primary-hover: #0088aa;
      --green: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Left Nav */
    .app-nav {
      width: 64px;
      background: #060910;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 20px;
    }
    .nav-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #00add8, #006688);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Conversations List */
    .inbox-list {
      width: 320px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .inbox-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inbox-title { font-size: 16px; font-weight: 700; }
    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
    }
    .badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

    .threads-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .thread-item {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .thread-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .thread-item.active {
      background: rgba(0, 173, 216, 0.15);
      border-color: rgba(0, 173, 216, 0.35);
    }
    .thread-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .thread-user { font-weight: 600; font-size: 14px; color: #fff; }
    .thread-time { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .thread-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Chat View */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--sidebar);
    }
    .current-user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00add8, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .user-name { font-weight: 700; font-size: 15px; }
    .user-status { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 4px; }

    .messages-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .msg-bubble.visitor {
      background: var(--card);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.admin {
      background: var(--primary);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-author { font-size: 11px; font-weight: 700; opacity: 0.8; margin-bottom: 4px; }
    .msg-timestamp { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px; font-family: monospace; }

    /* Footer & Quick Replies */
    .chat-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
    }
    .quick-replies {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .quick-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover { background: rgba(0, 173, 216, 0.2); color: #fff; border-color: var(--primary); }

    .reply-form { display: flex; gap: 12px; }
    .reply-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .reply-input:focus { border-color: var(--primary); }
    .btn-send {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-send:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <!-- Left Icon Bar -->
  <aside class="app-nav">
    <div class="nav-logo">⚡</div>
    <div style="font-size: 20px; cursor: pointer;" title="Inbox">📥</div>
    <div style="font-size: 20px; opacity: 0.4; cursor: pointer;" title="Analytics">📊</div>
    <div style="font-size: 20px; opacity: 0.4; cursor: pointer;" title="Settings">⚙️</div>
  </aside>

  <!-- Middle Conversations List -->
  <section class="inbox-list">
    <div class="inbox-header">
      <div class="inbox-title">Store Inbox</div>
      <div class="badge-live">
        <div class="badge-dot"></div>
        <span>Live Stream</span>
      </div>
    </div>
    <div class="threads-container" id="threads-box">
      <div class="thread-item active" onclick="selectThread('Visitor_Store')">
        <div class="thread-top">
          <span class="thread-user">🏪 Website Live Stream</span>
          <span class="thread-time" id="last-time">Now</span>
        </div>
        <div class="thread-preview" id="last-preview">Waiting for customer message...</div>
      </div>
    </div>
  </section>

  <!-- Right Chat View -->
  <main class="chat-view">
    <header class="chat-header">
      <div class="current-user-info">
        <div class="user-avatar" id="avatar-icon">V</div>
        <div>
          <div class="user-name" id="chat-title">SneakerVault Live Support</div>
          <div class="user-status">● Connected directly to Go WebSocket Hub</div>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--muted); font-family: monospace;">
        Agent: <strong style="color: #fff;">Manav (Store Owner)</strong>
      </div>
    </header>

    <div class="messages-area" id="messages-area">
      <div style="text-align: center; color: var(--muted); font-size: 13px; margin: 20px 0;">
        💬 Customer messages from your website will appear here in real time!
      </div>
    </div>

    <footer class="chat-footer">
      <div class="quick-replies">
        <button class="quick-btn" onclick="sendQuickReply('👋 Hello! How can I assist you with your order?')">👋 Greeting</button>
        <button class="quick-btn" onclick="sendQuickReply('✅ Yes, that item is currently in stock ready to ship!')">✅ In Stock</button>
        <button class="quick-btn" onclick="sendQuickReply('🎁 Here is a 10% coupon for your checkout: SAVE10')">🎁 10% Coupon</button>
        <button class="quick-btn" onclick="sendQuickReply('📦 Orders ship within 24 hours with full tracking.')">📦 Shipping Info</button>
      </div>

      <form class="reply-form" id="reply-form" onsubmit="handleSendReply(event)">
        <input type="text" id="reply-text" class="reply-input" placeholder="Type a reply to the customer..." autocomplete="off" required>
        <button type="submit" class="btn-send">Reply 🚀</button>
      </form>
    </footer>
  </main>

  <script>
    const host = window.location.host;
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProto}//${host}/ws?username=Store_Owner`;
    const socket = new WebSocket(wsUrl);

    const msgArea = document.getElementById("messages-area");
    const replyInput = document.getElementById("reply-text");
    const lastPreview = document.getElementById("last-preview");
    const lastTime = document.getElementById("last-time");

    socket.onmessage = (event) => {
      try {
        const rawPayloads = String(event.data).split("\n").filter(p => p.trim());
        for (const raw of rawPayloads) {
          const msg = JSON.parse(raw);
          if (msg.type === "group") {
            const isMe = msg.from_user === "Store_Owner";
            appendBubble(msg.from_user, msg.ciphertext || msg.text, isMe ? "admin" : "visitor", msg.timestamp);

            if (!isMe) {
              lastPreview.innerText = `${msg.from_user}: ${msg.ciphertext || msg.text}`;
              lastTime.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
          }
        }
      } catch (err) {
        console.error("Parse error:", err);
      }
    };

    function appendBubble(author, text, side, timestamp) {
      const div = document.createElement("div");
      div.className = `msg-bubble ${side}`;
      const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="msg-author">${escapeHtml(author)}</div>
        <div>${escapeHtml(text)}</div>
        <div class="msg-timestamp">${timeStr}</div>
      `;
      msgArea.appendChild(div);
      msgArea.scrollTop = msgArea.scrollHeight;
    }

    function handleSendReply(e) {
      e.preventDefault();
      const text = replyInput.value.trim();
      if (!text) return;

      replyInput.value = "";
      sendPayload(text);
    }

    function sendQuickReply(text) {
      sendPayload(text);
    }

    function sendPayload(text) {
      const payload = {
        type: "group",
        channel: "general",
        from_user: "Store_Owner",
        ciphertext: text,
        is_encrypted: false,
        timestamp: new Date().toISOString(),
      };
      socket.send(JSON.stringify(payload));
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
